[project]
name = "latent-switch"
version = "0.1.0"
description = "Do latent-language signals in the middle layers predict language switches in generated text?"
authors = [
    { name = "Nirajan Paudel", email = "nirajan.paudel@colorado.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "regex>=2026.9.29",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformer-lens>=4.2,<5",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
